<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro</title>
    <style>
        :root {
            --primary: #1976d2;
            --primary-hover: #1565c0;
            --primary-light: #e3f2fd;
            --entrada: #0288d1;
            --saida: #0d47a1;
            --bg: #eef5fc;
            --text-main: #1c3144;
            --card-border: #90caf9;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            color: var(--text-main);
        }

        .app-card { 
            background: #ffffff; 
            padding: 28px; 
            border-radius: 24px; 
            width: 100%; 
            max-width: 440px; 
            box-shadow: 0 16px 36px rgba(25, 118, 210, 0.08); 
            border-top: 8px solid var(--primary); 
        }

        h2 { 
            text-align: center; 
            color: var(--text-main); 
            margin-top: 0;
            margin-bottom: 24px; 
            font-size: 1.45rem; 
            letter-spacing: -0.5px; 
            cursor: pointer;
            user-select: none;
            transition: color 0.3s ease;
        }

        h2:hover {
            color: var(--primary);
        }

        /* Toggle Entrada / Saída */
        .type-toggle { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-bottom: 22px; 
        }

        .type-btn { 
            padding: 13px; 
            border: 2px solid transparent; 
            border-radius: 14px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.25s ease; 
            font-size: 0.95rem; 
            text-transform: uppercase; 
            background: var(--primary-light);
            color: var(--primary);
            opacity: 0.6;
        }

        .type-btn.active { 
            opacity: 1; 
            background: var(--primary); 
            color: #ffffff; 
            transform: translateY(-2px); 
            box-shadow: 0 6px 16px rgba(25, 118, 210, 0.25); 
        }

        label { 
            display: block; 
            margin: 16px 0 6px; 
            font-weight: 600; 
            font-size: 0.88rem; 
            color: #455a64; 
        }

        input, select { 
            width: 100%; 
            padding: 13px; 
            border-radius: 12px; 
            border: 2px solid #e1e8f0; 
            font-size: 0.95rem; 
            box-sizing: border-box; 
            background: #fbfdff; 
            transition: 0.2s ease; 
            color: var(--text-main);
        }

        input:focus, select:focus { 
            border-color: var(--primary); 
            outline: none; 
            background: #ffffff; 
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15);
        }

        .row { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 14px; 
        }

        .btn-salvar { 
            background: var(--primary); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 16px; 
            border-radius: 14px; 
            font-weight: 800; 
            font-size: 1.1rem; 
            margin-top: 26px; 
            cursor: pointer; 
            transition: all 0.25s ease; 
            box-shadow: 0 6px 18px rgba(25, 118, 210, 0.28);
        }

        .btn-salvar:hover { 
            background: var(--primary-hover); 
            transform: translateY(-1px);
        }

        .btn-salvar:active { 
            transform: scale(0.97); 
        }
    </style>
</head>
<body onload="init()">

<div class="app-card">
    <h2 id="titulo-app" onclick="easterEggTitulo()">Controle Financeiro 📊</h2>

    <div class="type-toggle">
        <button class="type-btn active" id="btn-in" onclick="setType('Entrada')">Recebi (+)</button>
        <button class="type-btn" id="btn-out" onclick="setType('Saída')">Gastei (-)</button>
    </div>

    <div class="row">
        <div>
            <label for="valor">Quanto? (R$)</label>
            <input type="number" id="valor" step="0.01" placeholder="0,00" inputmode="decimal">
        </div>
        <div>
            <label for="desc">O quê?</label>
            <input type="text" id="desc" placeholder="Ex: Farmácia, Mercado...">
        </div>
    </div>

    <div class="row">
        <div>
            <label for="categoria">Categoria</label>
            <select id="categoria"></select>
        </div>
        <div>
            <label for="metodo">Pagamento / Via</label>
            <select id="metodo">
                <option value="Pix">Pix</option>
                <option value="Débito">Débito</option>
                <option value="Crédito">Crédito</option>
                <option value="VR">VR</option>
                <option value="Dinheiro">Dinheiro</option>
            </select>
        </div>
    </div>

    <button class="btn-salvar" onclick="processarEnvio()">SALVAR</button>
</div>

<script>
    let currentType = 'Entrada';

    const categorias = {
        'Entrada': ['Salário', 'VR', 'Aluguel'],
        'Saída': [
            'Alimentação', 
            'Fixas', 
            'Farmácia', 
            'Dívida Antiga', 
            'Saúde', 
            'Roupas', 
            'Pra Casa', 
            'Investimento', 
            'Transporte', 
            'Lazer'
        ]
    };

    // Placeholders fofos e curtos que alternam
    const placeholders = [
        "Flores pro seu amor 🌷",
        "Café pra nós dois ☕",
        "Lanche merecido 🍔",
        "Um mimo especial ✨",
        "Aquele docinho 🍩",
        "Jantar romântico 🍕",
        "Sorvete de casal 🍦",
        "Para o nosso cantinho 🏡"
    ];

    function sortearPlaceholder() {
        const inputDesc = document.getElementById('desc');
        const aleatorio = placeholders[Math.floor(Math.random() * placeholders.length)];
        inputDesc.placeholder = aleatorio;
    }

    function init() {
        renderCategorias();
        sortearPlaceholder();
    }

    function setType(type) {
        currentType = type;
        document.getElementById('btn-in').classList.toggle('active', type === 'Entrada');
        document.getElementById('btn-out').classList.toggle('active', type === 'Saída');
        renderCategorias();
        sortearPlaceholder();
    }

    function renderCategorias() {
        const select = document.getElementById('categoria');
        const lista = categorias[currentType];
        select.innerHTML = lista.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    // Easter egg de clicar no título
    function easterEggTitulo() {
        const titulo = document.getElementById('titulo-app');
        titulo.innerText = "Controle para nosso futuro juntos!";
        setTimeout(() => {
            titulo.innerText = "Controle Financeiro 📊";
        }, 3000);
    }

    function processarEnvio() {
        const valor = document.getElementById('valor').value;
        const desc = document.getElementById('desc').value;
        const cat = document.getElementById('categoria').value;
        const met = document.getElementById('metodo').value;

        if (!valor || !desc) {
            alert("Psiu, faltou preencher a descrição ou o valor, meu bem!")
            return;
        }

        const dados = {
            tipo: currentType,
            valor: valor,
            descricao: desc,
            categoria: cat,
            pagamento: met,
            data: new Date().toISOString()
        };

        fetch("https://hook.us2.make.com/qmi8qqv6l3bvnmcbgbn8dsdfx6n8hn0c", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(dados)
        }).then(() => {
            // Mensagens fofas reativas à descrição
            const textoLower = desc.toLowerCase();
            let msgSucesso = `Lançamento de R$ ${valor} registrado com sucesso! ✅`;

            if (textoLower.includes("flor") || textoLower.includes("flores")) {
                msgSucesso = "Flores?! Você é o melhor namorado do mundo todinho! 💐🥰";
            } 
            else if (textoLower.includes("jantar") || textoLower.includes("encontro") || textoLower.includes("cinema")) {
                msgSucesso = "Salvo! E ó, já tô ansiosa pro nosso momento juntinhos 💕";
            } 
            else if (textoLower.includes("blablacar") || textoLower.includes("viagem")) {
                msgSucesso = "Não vejo a hora de você chegar pra me ver!";
            }
            

            alert(msgSucesso);
            
            // Limpa e sorteia outro placeholder
            document.getElementById('valor').value = '';
            document.getElementById('desc').value = '';
            sortearPlaceholder();
        }).catch(err => {
           alert("Erro na conexão, peça socorro a sua Deusa.");
            console.error(err);
        });
    }
</script>
</body>
</html>
